# 测试环境。地址是占位（*.test.internal），换成真实地址；密钥与 world_id 由部署注入，没有默认值。
# 只能写 schema 里标了 env_value 的字段，且要写全（见 common.yaml 头部）。

cluster:
  env: test
  world_id: ${ENV:BREEZE_WORLD_ID}

etcd:
  endpoints:
    - http://etcd-1.test.internal:2379
    - http://etcd-2.test.internal:2379
    - http://etcd-3.test.internal:2379
  dial_timeout_ms: 5000

redis:
  nodes:
    - { host: redis-1.test.internal, port: 6379 }
    - { host: redis-2.test.internal, port: 6379 }
    - { host: redis-3.test.internal, port: 6379 }
  password: ${ENV:BREEZE_REDIS_PWD}

mongo:
  uri: ${ENV:BREEZE_MONGO_URI}
  database: breeze_test
